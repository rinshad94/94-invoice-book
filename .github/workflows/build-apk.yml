name: Build 94 Invoice Book APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract project
        run: |
          unzip 94_invoice_book_cloud_build.zip -d project

      - name: Build APK
        run: gradle --no-daemon -p project assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: 94-Invoice-Book-APK
          path: project/app/build/outputs/apk/debug/*.apk
